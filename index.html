<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>옥계초 AI 수학 연수</title>
<meta name="description" content="생성형 AI로 만드는 우리 반 맞춤형 수학 학습자료 — 바이브코딩 · 생성형 이미지 · 제미나이 노트북 실습">
<meta property="og:title" content="옥계초 AI 수학 연수">
<meta property="og:description" content="실습 프롬프트를 복사하고, 만든 작품을 제출해요.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='25,7 75,7 100,50 75,93 25,93 0,50' fill='%23F2B705'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 교구 상자의 질서: 흰 종이 + 먹색 글자, 색은 패턴블럭 조각에만. 한 화면 앱, 목록 행이 모핑되어 화면이 된다. */
:root{
  --paper:#ffffff; --sheet:#f5f5f2; --rule:#e3e2dc; --ink:#17181d; --ink-2:#5c5e66; --ink-3:#8b8d94;
  --hex:#f2b705; --trap:#e2462c; --rho:#2f5bd3; --tri:#2a9a64; --sq:#ef8a22; --thin:#d9c7a3;
  --focus:#2f5bd3; --ok:#2a9a64; --on-ink:#ffffff;
  --serif:"Gowun Batang","Noto Serif KR","Batang",serif;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
}
@media (prefers-color-scheme: dark){ :root{
  --paper:#121317; --sheet:#1b1c22; --rule:#2c2e36; --ink:#eeede8; --ink-2:#aeafb6; --ink-3:#7c7e86;
  --focus:#7d9bff; --on-ink:#121317 } }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cap{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

.app{height:100dvh;display:flex;flex-direction:column;
  padding:max(20px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(28px,env(safe-area-inset-left,0px))}

/* ---------- 첫 화면 ---------- */
#home{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,4vw,64px)}
.lead{display:flex;flex-direction:column;justify-content:space-between;min-height:0;padding-block:8px}
.brand{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.hero h1{font-size:clamp(34px,4.6vw,64px);line-height:1.12;margin-top:14px}
.hero p{color:var(--ink-2);margin:16px 0 0;max-width:34em}
.menu{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.row{display:grid;grid-template-columns:52px 34px minmax(0,1fr) auto 24px;align-items:center;gap:14px;width:100%;padding:16px 4px;border-bottom:1px solid var(--rule);text-align:left;transition:background .25s,padding .25s}
.row .n{color:var(--ink-3)}
.row .shape{width:28px;height:28px;transition:clip-path .6s cubic-bezier(.6,.05,.3,1.15),transform .6s}
.row b{font-family:var(--serif);font-size:clamp(20px,2vw,26px);font-weight:700}
.row .m{color:var(--ink-3);font-size:13px}
.row .ar{transition:transform .25s;color:var(--ink-3)}
.row:hover{background:var(--sheet);padding-inline:14px}
.row:hover .ar{transform:translateX(4px);color:var(--ink)}
.row:hover .shape{clip-path:var(--hex6)!important;transform:rotate(60deg)}
.art{position:relative;min-height:0;border-radius:4px;overflow:hidden;background:var(--sheet)}
.art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.art .legend{position:absolute;left:16px;bottom:14px;right:16px;display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-2);font-size:12px;background:color-mix(in srgb,var(--paper) 86%,transparent);padding:8px 12px;border-radius:3px;backdrop-filter:blur(4px)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}

/* 패턴블럭 6점 다각형 — 점 개수가 같아 서로 모핑된다 */
.shape{--hex6:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%);
  --tri6:polygon(50% 6%,50% 6%,75% 49%,100% 92%,0% 92%,25% 49%);
  --sq6:polygon(10% 10%,90% 10%,90% 50%,90% 90%,10% 90%,10% 50%);
  --rho6:polygon(50% 2%,50% 2%,96% 50%,50% 98%,50% 98%,4% 50%);
  --trap6:polygon(25% 18%,75% 18%,87.5% 50%,100% 82%,0% 82%,12.5% 50%)}

/* ---------- 주제 화면 ---------- */
#view{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.vhead{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0 14px;border-bottom:1px solid var(--rule)}
.vhead .shape{width:30px;height:30px;clip-path:var(--hex6)}
.vhead h2{font-size:clamp(24px,2.6vw,34px)}
.vhead .m{color:var(--ink-3);font-size:13px}
.back{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:500;padding:8px 14px;border:1px solid var(--rule);border-radius:999px}
.back:hover{border-color:var(--ink)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr) 340px;view-transition-name:grid}
.col{min-height:0;overflow:auto;padding:22px 24px}
.col + .col{border-left:1px solid var(--rule)}
.idx{padding-left:0}
.tab{display:block;width:100%;text-align:left;padding:12px 14px 12px 0;border-bottom:1px solid var(--rule)}
.tab .k{display:block}
.tab b{display:block;font-weight:600;font-size:15px;margin-top:2px}
.tab small{color:var(--ink-3);font-size:12px}
.tab[aria-selected="true"] b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--acc)}
.tab[aria-selected="true"] .k{color:var(--acc)}
.tab:hover b{color:var(--ink)}
.toc-note{margin-top:18px;color:var(--ink-3);font-size:12px}

.main h3{font-size:clamp(24px,2.2vw,30px)}
.facts{display:flex;flex-wrap:wrap;gap:6px 28px;margin:14px 0 18px;padding:12px 0;border-block:1px solid var(--rule)}
.facts div{display:grid;gap:2px}
.facts dd{margin:0;font-weight:500}
.block{margin-top:14px;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.block .bh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px 0 16px}
.block pre{margin:0;padding:8px 16px 16px;white-space:pre-wrap;overflow-wrap:anywhere;font:400 16px/1.75 var(--sans)}
.copy{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--ink);color:var(--on-ink)}
.copy:hover{opacity:.86}
.copy.done{background:var(--ok)}
.opts{margin-top:18px}
.og{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.og:first-child{border-top:0}
.og .cap{padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 12px;border:1px solid var(--rule);border-radius:999px;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.hint{color:var(--ink-3);font-size:13px;margin:12px 0 0}
.line{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.line select{border:1px solid var(--rule);background:var(--paper);border-radius:3px;padding:7px 10px;font-size:14px;max-width:100%}
.ghost{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:6px 12px;border:1px solid var(--rule);border-radius:999px;text-decoration:none;white-space:nowrap}
.ghost:hover{border-color:var(--ink)}
.ghost.done{border-color:var(--ok);color:var(--ok)}
.photo{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center;margin-bottom:6px}
.photo img{width:150px;height:98px;object-fit:cover;border-radius:3px;cursor:zoom-in;display:block}
.photo p{margin:0 0 8px;color:var(--ink-2);font-size:13px}

/* 작품 제출 */
.sub h4{font-family:var(--serif);font-size:20px;margin:0}
.sub .cnt{color:var(--ink-3);font-size:13px;margin-left:6px}
.sub form{display:grid;gap:8px;margin-top:14px}
.sub .two{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:8px}
.sub label{display:grid;gap:4px}
.sub input{width:100%;min-width:0;border:1px solid var(--rule);background:var(--paper);border-radius:3px;padding:9px 11px;font-size:14px}
.sub input:focus{border-color:var(--ink);outline:none}
.send{margin-top:2px;background:var(--ink);color:var(--on-ink);font-weight:600;font-size:14px;padding:10px;border-radius:3px}
.send:disabled{opacity:.4;cursor:not-allowed}
.msg{font-size:13px;color:var(--ink-2);margin:2px 0 0;min-height:1.2em}
.list{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--ink)}
.list li{padding:11px 0;border-bottom:1px solid var(--rule);display:grid;gap:2px;min-width:0}
.list a{font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.list a:hover{text-decoration:underline;text-underline-offset:3px}
.list .who{display:flex;gap:8px;align-items:baseline;color:var(--ink-3);font-size:12px}
.list .del{margin-left:auto;font-size:12px;color:var(--ink-3);text-decoration:underline}
.empty{color:var(--ink-3);font-size:13px;padding:14px 0;margin:0}

/* 차례 안내: 실제 시간 비례 막대 */
.timeline{grid-column:1/-1;padding:36px 4px;display:flex;flex-direction:column;justify-content:center;gap:28px;min-height:0}
.bar{display:grid;grid-template-columns:10fr 55fr 25fr 25fr 5fr;height:14px;gap:3px}
.bar span{display:block}
.segs{display:grid;grid-template-columns:10fr 55fr 25fr 25fr 5fr;gap:3px}
.seg{display:grid;align-content:start;gap:6px;padding-top:10px;border-top:1px solid var(--ink);min-width:0;text-align:left}
.seg b{font-family:var(--serif);font-size:clamp(16px,1.6vw,22px)}
.seg small{color:var(--ink-3);font-size:12px}
button.seg:hover b{text-decoration:underline;text-underline-offset:4px}
.seg ul{margin:4px 0 0;padding:0;list-style:none;color:var(--ink-2);font-size:13px;display:grid;gap:2px}
.ends{display:flex;justify-content:space-between;color:var(--ink-3)}

dialog{border:0;border-radius:4px;padding:16px;width:min(980px,94vw);max-height:92dvh;background:var(--paper);color:var(--ink);box-shadow:0 30px 80px rgb(0 0 0 / .25)}
dialog::backdrop{background:rgb(15 16 20 / .6)}
dialog img{max-width:100%;max-height:80dvh;display:block;margin:10px auto 0}
.dh{display:flex;justify-content:space-between;align-items:center}

::view-transition-group(*){animation-duration:.55s;animation-timing-function:cubic-bezier(.6,.02,.2,1)}

@media (max-width:1180px){ .grid{grid-template-columns:200px minmax(0,1fr)} .sub{grid-column:1/-1;border-left:0!important;border-top:1px solid var(--rule)} .grid{grid-template-rows:minmax(0,1fr) auto} .sub{max-height:42dvh} }
@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;min-height:100dvh;padding-inline:max(18px,env(safe-area-inset-left,0px))}
  #home{grid-template-columns:1fr}
  .art{height:46vw;order:-1}
  .grid{grid-template-columns:1fr}
  .col{overflow:visible;padding:18px 0}
  .col + .col{border-left:0;border-top:1px solid var(--rule)}
  .idx{display:flex;overflow-x:auto;gap:18px}
  .tab{flex:none;width:auto;border:0}
  .sub{max-height:none}
  .row{grid-template-columns:36px 26px minmax(0,1fr) 20px} .row .m{display:none}
  .timeline .bar,.timeline .segs{grid-template-columns:1fr} .bar{display:none}
}
@media (prefers-reduced-motion:reduce){ ::view-transition-group(*){animation-duration:0s} .row,.row .shape,.row .ar{transition:none} }
</style>
</head>
<body>
<div class="app">
  <section id="home" aria-label="첫 화면">
    <div class="lead">
      <div>
        <div class="brand"><span class="cap">2026 수학나눔성장학교 · 교사 역량 강화 연수</span><span class="cap">옥계초등학교</span></div>
        <div class="hero">
          <h1>생성형 AI로 만드는<br>우리 반 맞춤형<br>수학 학습자료</h1>
          <p>같은 넓이, 다른 조각. 육각형 하나가 사다리꼴 둘, 마름모 셋, 삼각형 여섯이 되듯 — 하나의 수업이 아이마다 다른 자료가 됩니다.</p>
        </div>
      </div>
      <nav aria-label="메뉴"><ol class="menu" id="menu"></ol></nav>
      <div class="brand"><span class="mono" style="font-size:12px;color:var(--ink-3)">2026.10.21 WED · 14:30–16:30</span><span style="font-size:12px;color:var(--ink-3)">경북 소천초등학교 교사 이응석</span></div>
    </div>
    <figure class="art" aria-label="패턴블럭 테셀레이션: 육각형이 같은 넓이의 다른 조각으로 바뀌는 그림">
      <canvas id="tess"></canvas>
      <figcaption class="legend"><span><i style="background:var(--hex)"></i>육각형 1</span><span><i style="background:var(--trap)"></i>사다리꼴 2</span><span><i style="background:var(--rho)"></i>마름모 3</span><span><i style="background:var(--tri)"></i>삼각형 6</span><span class="mono">= 같은 넓이</span></figcaption>
    </figure>
  </section>
  <section id="view" hidden aria-live="polite"></section>
</div>

<dialog id="dlg"><div class="dh"><span class="cap" id="dlgTitle"></span><button class="back" type="button" id="dlgClose">닫기</button></div><div id="dlgBody"></div></dialog>

<script>
/* 작품 제출 저장소: 구글 Apps Script 웹 앱 (apps-script/Code.gs) */
const API_URL = "https://script.google.com/macros/s/AKfycby7IOJwx51kyUNgJ5BtW7X09KAnI48eyShxgVBXBiAoNtFz4cuYM-xIcKWsVRtLIhr6/exec";

const OLYMPIC_LEAD = "\n\n참고 예시(멀티샷): 아래 내 놀이처럼 화면 구성과 몸으로 답하는 방식을 비슷하게 만들어 줘.\n";
const ESCAPE_LEAD = "\n\n참고 예시(멀티샷): 아래 내 방탈출처럼 이야기 → 문항 → 정답 판정 흐름을 비슷하게 만들어 줘.\n";
const TOPICS = [
 {id:"toc",no:"01",name:"차례 안내",meta:"2시간 흐름",acc:"var(--sq)",shape:"sq6"},
 {id:"p1",no:"02",name:"바이브코딩",meta:"실습 4 · 55분",acc:"var(--trap)",shape:"trap6",items:[
  {id:"v1",short:"교과서 퀴즈",title:"교과서 찍어 퀴즈 웹앱",device:"휴대폰",tool:"제미나이 캔버스",tip:"교과서 사진을 올리고 한 줄로 요청해요.",
   img:{src:"assets/textbook-2-5dan.jpg",alt:"2학년 수학 교과서 '5단 곱셈구구를 알아볼까요' 쪽",file:"교과서_2학년_5단곱셈구구.jpg"},
   prompts:[["퀴즈 웹앱","첨부한 교과서 사진으로 퀴즈 웹앱 제작\n귀엽게, 재미있는 놀이처럼, 효과음, 1분 게임으로"],["정리 게임","초등 2학년 구구단 타워 쌓기 게임 제작\n귀엽게, 재미있는 놀이, 효과음, 1분 게임으로"]]},
  {id:"v2",short:"수업계획 → 웹앱",title:"메타프롬프트로 수업계획, 그다음 웹앱",device:"PC",tool:"제미나이 캔버스",tip:"앱부터가 아니라 수업 계획부터. 도구를 빼도 수업이 남는지 확인해요.",
   prompts:[["① 프롬프트 제안받기","초등 2학년 수학 '시각과 시간' 몇 시 몇 분 읽기 수업 계획을 위한 프롬프트를 제안해 줘."],["② 수업 계획 받기","(①에서 받은 프롬프트 붙여 넣기)\n웹앱을 이용한 활동이 하나 들어가도록 제안해 줘."],["③ 웹앱 만들기","이 수업에서 사용할 웹앱을 만들어 줘."]]},
  {id:"v3",short:"모션인식 놀이",title:"몸으로 푸는 모션인식 수학 놀이",device:"PC · 웹캠",tool:"구글 AI 스튜디오 (Build)",tip:"미리보기에서 카메라 '허용'을 눌러야 동작해요.",
   prompts:[["모션인식 게임","초등 2학년 모션인식 구구단 게임 제작\n정답 풍선 터트리기\n카메라가 없으면 마우스나 터치로\n효과음"]],
   refs:{label:"참고할 내 놀이",lead:OLYMPIC_LEAD,rows:[
     ["전체 포털","https://motion-math-olympics-portal.vercel.app/"],
     ["1학년 · 동계올림픽","https://motion-math-olympics-1st.vercel.app/"],
     ["2학년 · 하계올림픽","https://motion-math-olympics.vercel.app/"],
     ["3학년 · 속도 & 태그형","https://motion-math-olympics-3rd.vercel.app/"],
     ["4학년 · 동작 & 영역형","https://motion-math-olympics-4th.vercel.app/"],
     ["5학년 · 거리 & 필드형","https://motion-math-olympics-5th.vercel.app/"],
     ["6학년 · 표적 & 네트형","https://motion-math-olympics-6th.vercel.app/"]]}},

}

const dlg=document.getElementById("dlg");
function openDlg(title,node){ document.getElementById("dlgTitle").textContent=title; const b=document.getElementById("dlgBody"); b.textContent=""; b.append(node); dlg.showModal(); }
document.getElementById("dlgClose").addEventListener("click",()=>dlg.close());
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); });

/* ---------- 패턴블럭 테셀레이션: 육각형이 같은 넓이의 다른 조각으로 바뀐다 ---------- */
(function(){
  const cv=document.getElementById("tess"), ctx=cv.getContext("2d");
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let W,H,S,cells=[],dpr=1;
  const KINDS=["hex","trap","rho","tri"];
  function setup(){
    const r=cv.getBoundingClientRect(); dpr=Math.min(2,devicePixelRatio||1); W=r.width; H=r.height; if(!W||!H) return;
    cv.width=W*dpr; cv.height=H*dpr; S=Math.max(30,Math.min(W,H)/7.5);
    cells=[]; const w=S*1.5, h=Math.sqrt(3)*S;
    for(let i=-1;i*w<W+S;i++) for(let j=-1;j*h<H+h;j++){
      const cx=i*w, cy=j*h+(i%2?h/2:0);
      cells.push({cx,cy,kind:KINDS[(Math.random()*4)|0],rot:((Math.random()*6)|0),a:1,next:null});
    }
    draw();
  }
  function V(c,k){ const a=(Math.PI/3)*(k+c.rot); return [c.cx+S*Math.cos(a), c.cy+S*Math.sin(a)]; }
  function poly(pts,fill){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); ctx.stroke(); }
  function piece(c,kind,alpha){
    const C=[c.cx,c.cy], v=k=>V(c,k%6); ctx.globalAlpha=alpha;
    if(kind==="hex") poly([0,1,2,3,4,5].map(v),css("--hex"));
    if(kind==="trap"){ poly([v(0),v(1),v(2),v(3)],css("--trap")); poly([v(3),v(4),v(5),v(0)],css("--trap")); }
    if(kind==="rho"){ [0,2,4].forEach(k=>poly([C,v(k),v(k+1),v(k+2)],css("--rho"))); }
    if(kind==="tri"){ [0,1,2,3,4,5].forEach(k=>poly([C,v(k),v(k+1)],css("--tri"))); }
    ctx.globalAlpha=1;
  }
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    ctx.lineWidth=Math.max(1.5,S*0.05); ctx.strokeStyle=css("--sheet"); ctx.lineJoin="round";
    cells.forEach(c=>{ piece(c,c.kind,1); if(c.next) piece(c,c.next,c.t); });
  }
  let last=0;
  function tick(ts){
    if(!document.hidden && !home.hidden && cells.length){
      if(ts-last>650){ last=ts; const c=cells[(Math.random()*cells.length)|0]; if(!c.next){ let k; do{k=KINDS[(Math.random()*4)|0];}while(k===c.kind); c.next=k; c.t=0; } }
      let busy=false; cells.forEach(c=>{ if(c.next){ busy=true; c.t+=0.035; if(c.t>=1){ c.kind=c.next; c.next=null; c.rot=(Math.random()*6)|0; } } });
      if(busy) draw();
    }
    requestAnimationFrame(tick);
  }
  addEventListener("resize",setup); matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",draw);
  setup(); if(!reduce) requestAnimationFrame(tick);
  window.__tessSetup=setup;
})();

route(true); load();
setInterval(()=>{ if(!document.hidden) load(); },20000);
</script>
</body>
