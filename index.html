<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>옥계초 AI 수학 연수</title>
<meta name="description" content="생성형 AI로 만드는 우리 반 맞춤형 수학 학습자료 — 실습 프롬프트와 작품 링크 나눔">
<meta property="og:title" content="옥계초 AI 수학 연수">
<meta property="og:description" content="바이브코딩 · 생성형 이미지 · 제미나이 노트북 실습 프롬프트 복사하고, 내 작품 링크 올리기">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* 흰 바탕 · 위에서 아래로 한 줄: 흐름 → 실습 카드(프롬프트 복사 + 링크 댓글) → 마무리 */
:root{
  --bg:#ffffff; --surface:#f6f7fb; --line:#e4e6ef; --fg:#2e3350; --muted:#6b7088;
  --hex:#ffc23d; --trap:#ff7a7a; --rho:#4f8ff7; --tri:#2ec4a0; --sq:#ff9f43;
  --p1:#ff7a7a; --p1-l:#ffeceb; --p2:#8b7bff; --p2-l:#efedff; --p3:#3fa9f5; --p3-l:#e6f3fe;
  --code:#fffaf0; --link:#2f6fe0; --on:#ffffff;
  --display:"Jua","Noto Sans KR","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#161826; --surface:#1f2234; --line:#30344b; --fg:#eef0fa; --muted:#a3a8c3;
  --p1-l:#3a2427; --p2-l:#29254a; --p3-l:#1b2c42; --code:#23263a; --link:#86b3ff; --on:#161826 } }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.3;text-wrap:balance}
button{font:inherit;cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--rho);outline-offset:2px}

/* 패턴블럭 모핑: 모든 모양이 같은 6점 다각형이라 서로 부드럽게 바뀐다 */
.pb{--hex6:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%);
    --tri6:polygon(50% 4%,50% 4%,75% 48%,98% 92%,2% 92%,25% 48%);
    --sq6:polygon(8% 8%,92% 8%,92% 50%,92% 92%,8% 92%,8% 50%);
    --rho6:polygon(50% 2%,50% 2%,98% 50%,50% 98%,50% 98%,2% 50%);
    --trap6:polygon(25% 14%,75% 14%,87% 50%,100% 86%,0% 86%,13% 50%);
    aspect-ratio:1/1;transition:clip-path .7s cubic-bezier(.6,.05,.3,1.2),background-color .5s,transform .5s}

header{padding-block:44px 28px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header .txt{flex:1 1 380px;min-width:0}
.eyebrow{display:inline-block;background:var(--trap);color:var(--on);font-weight:700;font-size:13px;padding:4px 12px;border-radius:999px}
h1{font-size:clamp(32px,6vw,50px);margin-top:12px}
h1 em{font-style:normal;color:var(--trap)}
.meta{color:var(--muted);margin:10px 0 0}
.stage{position:relative;width:200px;height:200px;flex:none}
.stage .pb{position:absolute}
.s1{width:110px;left:45px;top:45px;animation:mA 8s infinite}
.s2{width:62px;left:0;top:0;animation:mB 8s infinite}
.s3{width:56px;right:0;top:12px;animation:mC 8s infinite}
.s4{width:60px;left:8px;bottom:0;animation:mD 8s infinite}
.s5{width:52px;right:6px;bottom:8px;animation:mE 8s infinite}
@keyframes mA{0%,20%{clip-path:var(--hex6);background:var(--hex)}25%,45%{clip-path:var(--trap6);background:var(--trap)}50%,70%{clip-path:var(--rho6);background:var(--rho)}75%,95%{clip-path:var(--tri6);background:var(--tri)}100%{clip-path:var(--hex6);background:var(--hex)}}
@keyframes mB{0%,40%{clip-path:var(--tri6);background:var(--tri)}50%,90%{clip-path:var(--sq6);background:var(--sq);transform:rotate(45deg)}100%{clip-path:var(--tri6);background:var(--tri)}}
@keyframes mC{0%,40%{clip-path:var(--rho6);background:var(--rho)}50%,90%{clip-path:var(--hex6);background:var(--hex)}100%{clip-path:var(--rho6);background:var(--rho)}}
@keyframes mD{0%,40%{clip-path:var(--trap6);background:var(--trap)}50%,90%{clip-path:var(--tri6);background:var(--tri);transform:rotate(180deg)}100%{clip-path:var(--trap6);background:var(--trap)}}
@keyframes mE{0%,40%{clip-path:var(--sq6);background:var(--sq)}50%,90%{clip-path:var(--rho6);background:var(--rho)}100%{clip-path:var(--sq6);background:var(--sq)}}

/* 랜딩: 큰 주제 버튼 3개 */
.topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:8px}
.topic{border:0;background:var(--acc-l);color:var(--fg);border-radius:26px;padding:34px 14px 30px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;transition:transform .25s}
.topic .pb{width:110px}
.topic .t{display:grid;gap:4px}
.topic b{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,32px);line-height:1.2}
.topic small{color:var(--muted);font-size:15px}
.topic:hover{transform:translateY(-4px)}
.topic:hover .pb{clip-path:var(--hex6)!important;transform:rotate(30deg)}
.back{border:0;background:var(--surface);color:var(--fg);font-weight:700;border-radius:999px;padding:8px 16px;font-size:15px}
@media (max-width:640px){ .topics{grid-template-columns:1fr;gap:10px} .topic{flex-direction:row;padding:18px 20px;text-align:left;gap:16px} .topic .pb{width:64px} .topic span.t{display:grid} }
::view-transition-group(*){animation-duration:.55s;animation-timing-function:cubic-bezier(.6,.05,.3,1.1)}
/* 파트 */
.part{padding-top:24px}
.part .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.part h2{font-size:clamp(26px,4vw,32px);display:flex;align-items:center;gap:10px}
.part h2 .pb{width:52px}
.part .desc{color:var(--muted);margin:6px 0 0}
.card{margin-top:16px;background:var(--acc-l);border-radius:20px;padding:22px}
.card h3{font-size:24px}
.card h3 span{display:inline-block;background:var(--acc);color:var(--on);font-size:15px;padding:2px 10px;border-radius:999px;margin-right:8px;vertical-align:3px}
.how{margin:6px 0 0;color:var(--fg)}
.how b{color:var(--acc)}
.prompt{margin-top:12px;background:var(--code);border-radius:14px;border:2px dashed var(--line);overflow:hidden}
.prompt header{all:unset;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px 0 14px}
.prompt header span{font-weight:700;font-size:14px;color:var(--muted)}
.prompt pre{margin:0;padding:8px 14px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--body);font-size:17px}
.copy{border:0;border-radius:10px;background:var(--acc);color:var(--on);font-weight:700;font-size:15px;padding:6px 16px}
.copy.done{background:var(--tri)}
.img{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;background:var(--bg);border-radius:14px;padding:12px}
.img img{border-radius:10px;display:block;width:100%;max-height:300px;object-fit:contain}
.btn{display:inline-block;text-decoration:none;border-radius:10px;background:var(--fg);color:var(--bg);font-weight:700;font-size:15px;padding:8px 14px;white-space:nowrap}
.extra{margin:10px 0 0;font-size:15px}
.refs{margin-top:12px;background:var(--bg);border-radius:14px;padding:14px}
.refs h4{margin:0;font-size:16px}
.refhint{margin:2px 0 8px;font-size:14px;color:var(--muted)}
.refs ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.refs li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.refs li b{min-width:150px}
.refs .lk{display:flex;flex-wrap:wrap;gap:6px 12px;flex:1 1 200px}
.refs .lk span{display:inline-flex;gap:6px;align-items:center}
.mini{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;font-size:13px;font-weight:700;padding:3px 9px}
.mini.done{background:var(--tri);color:var(--on);border-color:var(--tri)}
.pick{border:1.5px solid var(--acc);background:var(--bg);color:var(--fg);border-radius:999px;font-size:13px;font-weight:700;padding:3px 12px;margin-left:auto}
.pick[aria-pressed="true"]{background:var(--acc);color:var(--on)}
.pick[aria-pressed="true"]::before{content:"✓ "}
.styles{margin-top:12px}
.toggle{border:0;border-radius:12px;background:var(--acc);color:var(--on);font-weight:700;padding:9px 16px}
.sgrid{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;view-transition-name:sgrid}
.sgrid figure{margin:0;background:var(--bg);border-radius:12px;padding:8px;display:grid;gap:6px;align-content:start}
.sgrid img{width:100%;aspect-ratio:1/1;object-fit:contain;background:var(--surface);border-radius:8px}
.sgrid figcaption{font-weight:700;font-size:14px}

/* 댓글 */
.cmt{margin-top:14px;background:var(--bg);border-radius:14px;padding:14px}
.cmt form{display:grid;grid-template-columns:minmax(0,.6fr) minmax(0,1.6fr) auto;gap:8px}
.cmt input{font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;min-width:0}
.send{border:0;border-radius:10px;background:var(--acc);color:var(--on);font-weight:700;padding:8px 16px;white-space:nowrap}
.send:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:14px;font-weight:700;margin:6px 0 0;min-height:1.3em}
.clist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.clist li{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;min-width:0;font-size:15px;padding:4px 0;border-top:1px solid var(--line)}
.clist .who{font-weight:700}
.clist a{overflow-wrap:anywhere;min-width:0}
.del{margin-left:auto;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
.empty{color:var(--muted);font-size:14px;margin:6px 0 0}

/* 마무리 */
.end{margin-top:40px;padding:22px;border-radius:20px;background:var(--surface)}
.end ul{margin:10px 0 0;padding-left:20px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.links a{text-decoration:none;font-weight:700;border:1.5px solid var(--line);border-radius:12px;padding:7px 12px;background:var(--bg)}
footer{padding-block:32px 48px;color:var(--muted);font-size:14px}

@media (max-width:640px){
  .stage{width:150px;height:150px;transform-origin:left top}
  .stage .pb{scale:.75}
  .cmt form{grid-template-columns:1fr}
  .img{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ .stage .pb{animation:none;clip-path:var(--hex6);background:var(--hex)} .pb{transition:none} }
</style>
</head>

     ["assets/tree-original.jpg","원래 작품 (패턴블럭 트리)",null],["assets/tree-disney-lego.jpg","크리스마스 트리 · 디즈니 레고","크리스마스 트리\n디즈니 레고 스타일로"],["assets/tree-princess.jpg","공주 왕자 스타일","크리스마스 트리\n공주 왕자 스타일로"]]},
  {id:"i2",no:2,title:"프롬프트로 테셀레이션",how:"<b>✍️ 프롬프트만</b> + 제미나이 — [ ] 안 단어를 바꿔 여러 번",
   prompts:[["테셀레이션","[정육각형]을 기본으로 한 테셀레이션 무늬를 만들어 줘.\n[귀여운 고양이] 모양이 빈틈과 겹침 없이 반복되고,\n[무지개 6가지 색]으로."]],
   extra:"뽑은 뒤 확인: 정말 빈틈없이 덮였나요? 한 꼭짓점에 모인 각의 합은 360°인가요?"}]},
 {id:"p3",name:"제미나이 노트북",desc:"우리 반이 주인공인 수학 동화와 활동지",acc:"var(--p3)",l:"var(--p3-l)",shape:"tri6",col:"var(--tri)",items:[
  {id:"n1",no:1,title:"슬라이드로 수학 동화",how:"<b>노트북</b> → 스튜디오 <b>'슬라이드'</b> ✏️ 맞춤 설정에 입력",
   prompts:[["슬라이드 맞춤 설정","초등 2학년 2학기 수학 길이재기 펭수 수학동화 슬라이드 제작"]]},
  {id:"n2",no:2,title:"인포그래픽으로 활동지",how:"<b>같은 노트북</b> → 스튜디오 <b>'인포그래픽'</b> ✏️ 맞춤 설정에 입력",
   prompts:[["인포그래픽 맞춤 설정","수학 동화 내용으로 학생용 활동지 인포그래픽을 만들어 줘.\n· A4 세로, 귀엽고 큰 글씨\n· 답을 쓰는 칸을 넉넉하게\n· 흰색 배경"]],
   extra:"인쇄 전 숫자 · 글자 오류를 꼭 확인하세요."}]}
];

const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a)){if(n==="class")e.className=v;else if(n==="html")e.innerHTML=v;else if(n.startsWith("on"))e.addEventListener(n.slice(2),v);else e.setAttribute(n,v);}for(const c of k.flat()){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;};

function copyText(text,pre,btn){
  const orig=btn.dataset.label||(btn.dataset.label=btn.textContent);
  const ok=()=>{btn.textContent="복사됨!";btn.classList.add("done");setTimeout(()=>{btn.textContent=orig;btn.classList.remove("done");},1500);};
  const sel=()=>{if(pre.hidden){btn.textContent="복사 안 됨";setTimeout(()=>{btn.textContent=orig;},2000);return;}const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="Ctrl+C";setTimeout(()=>{btn.textContent=orig;},2500);};
  try{navigator.clipboard.writeText(text).then(ok,sel);}catch(e){sel();}
}

/* 내 놀이 참고하기: 링크 복사 + 프롬프트에 멀티샷으로 넣기 */
function refBox(r,pres){
  const box=el("div",{class:"refs"}), hint=el("p",{class:"refhint"},"넣을 놀이를 고르면 위 프롬프트 끝에 링크가 붙어요 (멀티샷). 다시 누르면 빠져요.");
  let picked=null;
  const update=()=>{ pres.forEach(p=>{ p.pre.textContent=p.base+(picked?r.lead+"\n"+picked.links.map(l=>l[1]).join("\n"):""); });
    box.querySelectorAll(".pick").forEach(b=>b.setAttribute("aria-pressed",String(b._row===picked))); };
  box.append(el("h4",{},r.title),hint);
  const list=el("ul",{});
  r.rows.forEach(row=>{
    const pick=el("button",{class:"pick",type:"button","aria-pressed":"false"},"＋ 프롬프트에 넣기");
    pick._row=row; pick.addEventListener("click",()=>{ picked=picked===row?null:row; update(); });
    list.append(el("li",{},el("b",{},row.name),
      el("span",{class:"lk"},row.links.map(([lab,url])=>{
        const c=el("button",{class:"mini",type:"button"},"링크 복사"), a=el("a",{href:url,target:"_blank",rel:"noopener"},lab);
        c.addEventListener("click",()=>copyText(url,a,c)); return el("span",{},a,c);
      })), pick));
  });
  box.append(list); return box;
}
/* 다양한 예시 스타일 보기 */
function styleBox(list){
  const wrap=el("div",{class:"styles"});
  const btn=el("button",{class:"toggle",type:"button","aria-expanded":"false"},"🎨 다양한 예시 스타일 보기");
  const grid=el("div",{class:"sgrid",hidden:""}, list.map(([src,cap,prompt])=>{
    const fig=el("figure",{},el("img",{src,alt:cap+" 예시",loading:"lazy"}),el("figcaption",{},cap));
    if(prompt){ const pre=el("pre",{hidden:""},prompt), c=el("button",{class:"mini",type:"button"},"이 스타일로 복사"); c.addEventListener("click",()=>copyText(prompt,pre,c)); fig.append(c,pre); }
    return fig;
  }));
  btn.addEventListener("click",()=>{ const open=grid.hidden; const go=()=>{grid.hidden=!open;btn.setAttribute("aria-expanded",String(open));btn.textContent=open?"🎨 예시 스타일 접기":"🎨 다양한 예시 스타일 보기";};
    if(document.startViewTransition&&!reduce) document.startViewTransition(go); else go(); });
  wrap.append(btn,grid); return wrap;
}

const root=document.getElementById("parts");
const TIMES={p1:"실습 4가지 · 55분",p2:"실습 2가지 · 25분",p3:"실습 2가지 · 25분"};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const tabs=document.getElementById("topics");
PARTS.forEach(p=>{
  const b=el("button",{class:"topic",type:"button",style:`--acc:${p.acc};--acc-l:${p.l}`},
    el("span",{class:"pb",style:`clip-path:var(--${p.shape});background:${p.col};view-transition-name:ic-${p.id}`}),
    el("span",{class:"t"},el("b",{},p.name),el("small",{},TIMES[p.id])));
  b.addEventListener("click",()=>{ location.hash=p.id; });
  tabs.append(b);
});
function route(){
  const id=location.hash.slice(1), ok=PARTS.some(p=>p.id===id);
  const apply=()=>{
    document.getElementById("home").hidden=ok;
    document.querySelectorAll(".part").forEach(s=>s.hidden=s.id!==id);
    window.scrollTo(0,0);
  };
  if(document.startViewTransition&&!reduce) document.startViewTransition(apply); else apply();
}
addEventListener("hashchange",route);
PARTS.forEach(p=>{
  const sec=el("section",{class:"part",id:p.id,style:`--acc:${p.acc};--acc-l:${p.l}`},
    el("div",{class:"top"},
      el("h2",{},el("span",{class:"pb",style:`clip-path:var(--hex6);background:${p.col};view-transition-name:ic-${p.id}`}),p.name),
      el("button",{class:"back",type:"button",onclick:()=>{ location.hash=""; history.replaceState(null,"",location.pathname); route(); }},"← 처음으로")),
    el("p",{class:"desc"},p.desc));
  p.items.forEach(x=>{
    const card=el("article",{class:"card",id:"c-"+x.id},
      el("h3",{},el("span",{},"실습 "+x.no),x.title),
      el("p",{class:"how",html:x.how}));
    if(x.img) card.append(el("div",{class:"img"},
      el("img",{src:x.img.src,alt:x.img.alt,loading:"lazy"}),
      el("a",{class:"btn",href:x.img.src,download:x.img.file},"⬇ 교과서 사진 받기")));
    const pres=[];
    x.prompts.forEach(([label,text])=>{
      const pre=el("pre",{},text), btn=el("button",{class:"copy",type:"button","aria-label":label+" 복사"},"복사");
      pres.push({pre,base:text});
      btn.addEventListener("click",()=>copyText(pre.textContent,pre,btn));
      card.append(el("div",{class:"prompt"},el("header",{},el("span",{},label),btn),pre));
    });
    if(x.refs) card.append(refBox(x.refs,pres));
    if(x.styles) card.append(styleBox(x.styles));
    if(x.extra && !x.extra.startsWith("<!--")) card.append(el("p",{class:"extra",html:x.extra}));
    card.append(el("div",{class:"cmt",id:"cmt-"+x.id}));
    sec.append(card);
  });
  sec.hidden=true;
  root.append(sec);
});

/* ---------- 실습별 작품 링크 댓글 ---------- */
let posts=[];
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const myTokens=store.get("okgye-tokens",{});
const allIds=PARTS.flatMap(p=>p.items.map(x=>x.id));

function renderCmt(id){
  const box=document.getElementById("cmt-"+id); if(!box) return;
  if(box.contains(document.activeElement)) return;      // 입력 중에는 다시 그리지 않기
  const list=posts.filter(p=>p.prac===id);
  box.textContent="";
  const name=el("input",{maxlength:"20",placeholder:"이름","aria-label":"이름",value:store.get("okgye-name","")});
  const url=el("input",{type:"url",inputmode:"url",maxlength:"500",placeholder:"내 작품 링크 붙여 넣기","aria-label":"작품 링크"});
  const send=el("button",{class:"send",type:"submit"},"올리기");
  const msg=el("p",{class:"msg",role:"status"});
  const form=el("form",{novalidate:""},name,url,send);
  if(!API_URL){[name,url,send].forEach(x=>x.disabled=true);msg.textContent="링크 올리기는 곧 열려요.";}
  form.addEventListener("submit",async e=>{
    e.preventDefault();
    const n=name.value.trim(),u=url.value.trim();
    if(!n){msg.textContent="이름을 적어 주세요.";name.focus();return;}
    if(!/^https?:\/\/\S+\.\S+/i.test(u)){msg.textContent="https:// 로 시작하는 링크를 붙여 넣어 주세요.";url.focus();return;}
    send.disabled=true;msg.textContent="올리는 중…";
    const token=Math.random().toString(36).slice(2)+Date.now().toString(36);
    try{
      const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"add",prac:id,name:n,url:u,token})});
      const j=await r.json(); if(!j.ok) throw 0;
      myTokens[j.id]=token; store.set("okgye-tokens",myTokens); store.set("okgye-name",n);
      document.activeElement.blur(); await load();
      const m=document.querySelector("#cmt-"+id+" .msg"); if(m) m.textContent="올렸어요!";
    }catch(err){msg.textContent="올리지 못했어요. 다시 눌러 주세요.";send.disabled=false;}
  });
  box.append(form,msg);
  if(!list.length){box.append(el("p",{class:"empty"},"아직 올라온 작품이 없어요."));return;}
  box.append(el("ul",{class:"clist"},list.map(p=>el("li",{},
    el("span",{class:"who"},p.name||"이름 없음"),
    /^https?:\/\//i.test(p.url)?el("a",{href:p.url,target:"_blank",rel:"noopener noreferrer"},p.url):el("span",{},p.url),
    myTokens[p.id]?el("button",{class:"del",type:"button",onclick:()=>del(p.id)},"삭제"):null))));
}
async function load(){
  if(API_URL){ try{const r=await fetch(API_URL+"?t="+Date.now());const j=await r.json();if(Array.isArray(j.posts))posts=j.posts;}catch(e){} }
  allIds.forEach(renderCmt);
}
async function del(id){
  try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"delete",id,token:myTokens[id]})});
    const j=await r.json(); if(j.ok){delete myTokens[id];store.set("okgye-tokens",myTokens);posts=posts.filter(p=>p.id!==id);allIds.forEach(renderCmt);}}catch(e){}
}
route(); load();
setInterval(()=>{if(API_URL&&!document.hidden)load();},20000);
</script>
